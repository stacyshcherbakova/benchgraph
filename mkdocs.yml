site_name: BenchGraph Docs
site_description: A Mac-native app for taking experimental data to trustworthy statistics and publication-quality figures, without writing code.
site_url: https://stacyshcherbakova.github.io/benchgraph/
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - footnotes
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: README.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Choosing an analysis: guide/choosing-an-analysis.md
      - Multi-panel figures: guide/multi-panel-figures.md
  - Research:
      - Market research: research/market-research.md
      - Prism analysis templates: research/prism-analysis-templates.md
  - Product:
      - MVP and roadmap: product/mvp-roadmap.md
  - Engineering:
      - Project spec: project-spec.md
